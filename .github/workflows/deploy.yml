name: CI/CD Pipeline - Test & Deploy to AWS EC2

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # =============================================================
  # Job 1: Continuous Integration (Tests & Build Validation)
  # =============================================================
  test-and-build:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      # Backend Checks
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Django Unit Tests
        env:
          SECRET_KEY: "ci-secret-key"
          DEBUG: "True"
          DB_ENGINE: "django.db.backends.sqlite3"
        run: |
          cd backend
          python manage.py test visitors

      # Frontend Checks
      - name: ⬢ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: 🏗️ Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

  # =============================================================
  # Job 2: Continuous Deployment (Auto Deploy to AWS EC2)
  # =============================================================
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: test-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Backend_Django || cd ~/portfolio || cd ~/app
            echo "==> Pulling latest changes from GitHub..."
            git pull origin main || git pull origin master
            
            echo "==> Rebuilding and restarting Docker containers..."
            docker compose up --build -d
            
            echo "==> Cleaning up dangling images..."
            docker image prune -f
            
            echo "==> Deployment Complete!"
