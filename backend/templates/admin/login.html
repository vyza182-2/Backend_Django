{% extends "admin/login.html" %}
{% load static %}

{% block title %}Authentication | VYZA Control Center{% endblock %}

{% block extrahead %}
{{ block.super }}
<link rel="stylesheet" type="text/css" href="{% static 'admin/css/custom_admin.css' %}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body.login {
    background: radial-gradient(circle at top center, #101c36 0%, #060910 70%) !important;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
  }
  #container {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    width: 100% !important;
    max-width: 440px !important;
    margin: 0 auto !important;
  }
  #content {
    background: linear-gradient(145deg, rgba(13, 20, 36, 0.95) 0%, rgba(20, 29, 51, 0.95) 100%) !important;
    border: 1px solid rgba(56, 189, 248, 0.25) !important;
    border-radius: 24px !important;
    padding: 38px 34px !important;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(6, 182, 212, 0.12) !important;
    backdrop-filter: blur(20px) !important;
  }
  #header {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    text-align: center !important;
    padding-bottom: 24px !important;
  }
  #branding h1 {
    justify-content: center !important;
    font-size: 1.6rem !important;
    margin: 0 !important;
  }
  .form-row {
    padding: 10px 0 !important;
    border: none !important;
  }
  .form-row label {
    color: #94a3b8 !important;
    font-size: 0.85rem !important;
    font-weight: 600 !important;
    margin-bottom: 8px !important;
    display: block !important;
  }
  .form-row input {
    width: 100% !important;
    box-sizing: border-box !important;
    padding: 12px 16px !important;
    font-size: 0.92rem !important;
    border-radius: 12px !important;
    background: #090e18 !important;
    border: 1px solid #1e293b !important;
    color: #f1f5f9 !important;
    transition: all 0.2s ease !important;
  }
  .form-row input:focus {
    border-color: #06b6d4 !important;
    box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2) !important;
  }
  .submit-row {
    padding: 22px 0 0 !important;
    margin: 0 !important;
    background: transparent !important;
    border: none !important;
    text-align: center !important;
  }
  .submit-row input {
    width: 100% !important;
    padding: 14px !important;
    font-size: 0.95rem !important;
    font-weight: 700 !important;
    border-radius: 12px !important;
    background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%) !important;
    color: #fff !important;
    border: none !important;
    cursor: pointer !important;
    box-shadow: 0 6px 20px rgba(6, 182, 212, 0.35) !important;
    transition: all 0.2s ease !important;
  }
  .submit-row input:hover {
    transform: translateY(-1px) !important;
    box-shadow: 0 8px 24px rgba(6, 182, 212, 0.5) !important;
    filter: brightness(1.1) !important;
  }
  .errornote {
    background: rgba(244, 63, 94, 0.15) !important;
    border: 1px solid rgba(244, 63, 94, 0.35) !important;
    color: #fda4af !important;
    border-radius: 12px !important;
    padding: 12px 16px !important;
    font-size: 0.85rem !important;
    font-weight: 600 !important;
    margin-bottom: 20px !important;
  }
</style>
{% endblock %}

{% block branding %}
<div style="text-align: center; margin-bottom: 12px;">
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 14px; background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.25); margin-bottom: 12px; color: #38bdf8; font-size: 1.4rem;">
        ⚡
    </div>
    <h1 style="font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.8rem; letter-spacing: -0.02em; background: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;">
        VYZA CONTROL CENTER
    </h1>
    <p style="color: #64748b; font-size: 0.82rem; margin-top: 6px; font-weight: 500;">
        Administrator Authentication & System Access
    </p>
</div>
{% endblock %}
