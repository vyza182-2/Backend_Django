name: CI/CD Pipeline - Test, Deploy & Monitor (AWS EC2)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # =============================================================
  # Job 1: Continuous Integration (Tests & Build Validation)
  # =============================================================
  test-and-build:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      # Backend Checks
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Django Unit Tests
        env:
          SECRET_KEY: "ci-secret-key"
          DEBUG: "True"
          DB_ENGINE: "django.db.backends.sqlite3"
        run: |
          cd backend
          python manage.py test visitors

      # Frontend Checks
      - name: ⬢ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: 🏗️ Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

  # =============================================================
  # Job 2: Continuous Deployment, Health Check & Auto-Rollback
  # =============================================================
  deploy-to-ec2:
    name: Deploy to AWS EC2 & Verify
    needs: test-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🔍 Check EC2 Configuration
        id: check-secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::⚠️ AWS EC2 Secrets (EC2_HOST, EC2_USER, EC2_SSH_KEY) not configured yet. Skipping deployment step."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Deploy, Health Check & Auto-Rollback on EC2
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Backend_Django || cd ~/portfolio || cd ~/app

            echo "==> Pulling latest changes from GitHub..."
            git pull origin main || git pull origin master

            echo "==> Building and deploying Docker containers..."
            docker compose up --build -d

            echo "==> Running Post-Deployment Health Check..."
            if ! bash ./scripts/health_check.sh http://localhost; then
              echo "❌ Health check failed! Initiating automated rollback..."
              bash ./scripts/rollback.sh
              exit 1
            fi

            echo "==> Cleaning up dangling images..."
            docker image prune -f

            echo "🎉 Deployment & Verification Complete!"

      # =============================================================
      # Job 3: Telegram Deployment Notifications
      # =============================================================
      - name: 📢 Telegram Alert (Success)
        if: success() && steps.check-secrets.outputs.configured == 'true'
        run: |
          MESSAGE="🚀 <b>Deployment Succeeded!</b>%0A%0A📦 <b>Repo:</b> ${{ github.repository }}%0A🔖 <b>Branch:</b> ${{ github.ref_name }}%0A👤 <b>Author:</b> ${{ github.actor }}%0A📝 <b>Commit:</b> ${{ github.event.head_commit.message }}%0A🌐 <b>Host:</b> ${{ secrets.EC2_HOST }}%0A%0A✔ Health checks passed & live!"
          curl -s -X POST "https://api.telegram.org/bot8250541502:AAFALN4E6kFdA1qvwu417HRAZFcTmiOVurw/sendMessage" \
            -d "chat_id=7278760428&text=${MESSAGE}&parse_mode=HTML"

      - name: 🚨 Telegram Alert (Failure / Rollback)
        if: failure() && steps.check-secrets.outputs.configured == 'true'
        run: |
          MESSAGE="❌ <b>Deployment FAILED & Rolled Back!</b>%0A%0A📦 <b>Repo:</b> ${{ github.repository }}%0A🔖 <b>Branch:</b> ${{ github.ref_name }}%0A👤 <b>Author:</b> ${{ github.actor }}%0A📝 <b>Commit:</b> ${{ github.event.head_commit.message }}%0A%0A⚠️ Please check GitHub Actions logs."
          curl -s -X POST "https://api.telegram.org/bot8250541502:AAFALN4E6kFdA1qvwu417HRAZFcTmiOVurw/sendMessage" \
            -d "chat_id=7278760428&text=${MESSAGE}&parse_mode=HTML"
