{% extends "admin/login.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<link rel="stylesheet" type="text/css" href="{% static 'admin/css/custom_admin.css' %}">
<style>
  body.login {
    background: radial-gradient(circle at top right, #111e38 0%, #07090e 60%) !important;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #container {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    width: 100% !important;
    max-width: 440px !important;
    margin: 0 auto !important;
  }
  #content {
    background: linear-gradient(135deg, rgba(13, 20, 36, 0.9) 0%, rgba(20, 29, 51, 0.9) 100%) !important;
    border: 1px solid rgba(56, 189, 248, 0.2) !important;
    border-radius: 24px !important;
    padding: 36px 32px !important;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(6, 182, 212, 0.1) !important;
    backdrop-filter: blur(16px) !important;
  }
  #header {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    text-align: center !important;
    padding-bottom: 20px !important;
  }
  #branding h1 {
    justify-content: center !important;
    font-size: 1.6rem !important;
  }
  .form-row label {
    color: #94a3b8 !important;
    font-size: 0.85rem !important;
    font-weight: 600 !important;
    margin-bottom: 6px !important;
  }
  .submit-row {
    padding: 18px 0 0 !important;
    margin: 0 !important;
    background: transparent !important;
    border: none !important;
    text-align: center !important;
  }
  .submit-row input {
    width: 100% !important;
    padding: 12px !important;
    font-size: 0.95rem !important;
    border-radius: 12px !important;
  }
</style>
{% endblock %}

{% block branding %}
<div style="text-align: center; margin-bottom: 8px;">
    <h1 style="font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.75rem; letter-spacing: -0.02em; background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;">
        VYZA CONTROL CENTER
    </h1>
    <p style="color: #64748b; font-size: 0.82rem; margin-top: 4px; font-weight: 500;">
        Production Administrator Authentication
    </p>
</div>
{% endblock %}
